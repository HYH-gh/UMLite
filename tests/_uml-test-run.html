<script>
window.__LIST__ = [{"n":"01-涉众模型.uml","s":"@diagram class \"图2-1 超市业务涉众模型\"\n\n// ================= 抽象层：涉众分类 =================\nabstract class 涉众 {\n    + 名称: String\n    + 类别: 外部/内部\n    + 关注点: String\n    + 期望: String\n    + 影响力: 高/中/低\n    + 利益程度: 高/中/低\n    + 态度: 支持/中立/反对\n}\n\nabstract class 外部涉众\nabstract class 内部涉众\n\n外部涉众 --|> 涉众 : 泛化\n内部涉众 --|> 涉众 : 泛化\n\n// ================= 被建模的业务本体 =================\nclass 超市业务 {\n    + 卖场与商品陈列\n    + 商品与供应链\n    + 收银与结算\n    + 会员与促销\n    + 超市业务管理系统\n}\n\n// ================= 外部涉众 =================\nclass 顾客 {\n    + 关注点: 新鲜、实惠、结账快、退换方便\n    + 期望: 一站式购齐、明码标价\n    + 影响力: 高\n    + 态度: 支持（价格敏感、易流失）\n}\n\nclass 会员顾客 {\n    + 关注点: 会员价、积分、专属券、生日礼\n    + 期望: 权益可见、核销顺畅、积分可查\n    + 影响力: 高\n    + 态度: 支持\n}\n\nclass 供应商 {\n    + 关注点: 上架率、账期、促销资源、损耗判责\n    + 期望: 结算准时、退货规则清晰\n    + 影响力: 高\n    + 态度: 中立（谈判型）\n}\n\nclass 集团总部 {\n    + 关注点: 统一价格形象、毛利、KPI、系统标准化\n    + 期望: 门店执行到位、数据可汇总\n    + 影响力: 高\n    + 态度: 支持\n}\n\nclass 支付机构 {\n    + 关注点: 交易成功率、费率、对账文件、合规\n    + 期望: 接口稳定、差错可追溯\n    + 影响力: 中\n    + 态度: 中立\n}\n\nclass 政府监管部门 {\n    + 关注点: 食品安全溯源、明码标价、计量准确、消防\n    + 期望: 索证索票齐全、可随时抽查\n    + 影响力: 高（强制性）\n    + 态度: 中立（合规约束）\n}\n\nclass 商场物业 {\n    + 关注点: 租金、营业时间、客流、垃圾与噪音\n    + 期望: 履约、不扰民\n    + 影响力: 中\n    + 态度: 中立\n}\n\nclass 周边居民与竞争者 {\n    + 关注点: 便利性、价格形象、社区影响\n    + 期望: 低价便利 / 市场份额\n    + 影响力: 低\n    + 态度: 中立\n}\n\n// ================= 内部涉众（业务工人与管理层） =================\nclass 店长 {\n    + 关注点: 销售额、毛利、损耗率、人效、满意度\n    + 期望: 数据实时、决策有依据\n    + 影响力: 高\n    + 态度: 支持\n}\n\nclass 收银员 {\n    + 关注点: 结账速度、错账责任、排班、系统易用\n    + 期望: 扫码快、少手工、差错可回溯\n    + 影响力: 中\n    + 态度: 支持（关注操作负担）\n}\n\nclass 理货员 {\n    + 关注点: 补货效率、陈列标准、报损判责\n    + 期望: 缺货提醒准确、PDA 好用\n    + 影响力: 中\n    + 态度: 支持\n}\n\nclass 收货员 {\n    + 关注点: 验收效率、单据一致、库位准确\n    + 期望: 收货单与订单自动比对\n    + 影响力: 中\n    + 态度: 支持\n}\n\nclass 防损员 {\n    + 关注点: 偷盗与损耗、监控、盘点差异\n    + 期望: 异常交易可预警\n    + 影响力: 中\n    + 态度: 中立（可能增加流程环节）\n}\n\nclass 客服专员 {\n    + 关注点: 退换货授权、投诉时效\n    + 期望: 小票与订单可快速检索\n    + 影响力: 中\n    + 态度: 支持\n}\n\nclass 财务对账员 {\n    + 关注点: 日结差异、渠道对账、发票\n    + 期望: 账实一致、差异可定位\n    + 影响力: 中\n    + 态度: 支持\n}\n\nclass IT运维 {\n    + 关注点: 系统可用性、POS 与网络、数据备份\n    + 期望: 故障可监控、可回滚\n    + 影响力: 中\n    + 态度: 支持\n}\n\n// ================= 泛化关系 =================\n顾客 --|> 外部涉众 : 泛化\n会员顾客 --|> 顾客 : 泛化\n供应商 --|> 外部涉众 : 泛化\n集团总部 --|> 外部涉众 : 泛化\n支付机构 --|> 外部涉众 : 泛化\n政府监管部门 --|> 外部涉众 : 泛化\n商场物业 --|> 外部涉众 : 泛化\n周边居民与竞争者 --|> 外部涉众 : 泛化\n\n店长 --|> 内部涉众 : 泛化\n收银员 --|> 内部涉众 : 泛化\n理货员 --|> 内部涉众 : 泛化\n收货员 --|> 内部涉众 : 泛化\n防损员 --|> 内部涉众 : 泛化\n客服专员 --|> 内部涉众 : 泛化\n财务对账员 --|> 内部涉众 : 泛化\nIT运维 --|> 内部涉众 : 泛化\n\n// ================= 关联：涉众与超市业务 =================\n外部涉众 \"*\" --> \"1\" 超市业务 : 提出关注与期望\n内部涉众 \"*\" --> \"1\" 超市业务 : 参与并执行业务\n\n// ================= 涉众之间的利益冲突 =================\n顾客 .. 供应商 : «冲突» 低价形象 vs 供货毛利\n顾客 .. 收银员 : «冲突» 结账速度 vs 逐件核对\n理货员 .. 供应商 : «冲突» 生鲜损耗判责\n集团总部 .. 供应商 : «冲突» 账期与促销投入\n顾客 .. 会员顾客 : «冲突» 普遍低价 vs 会员专属权益\n\n// ================= 说明 =================\nnotice \"建模说明\" {\n    1. 泛化：外部涉众 / 内部涉众 是抽象涉众类；\n       会员顾客 是 顾客 的特化（多一层权益关系）。\n    2. 关联：所有涉众都与\"超市业务\"发生关注或参与关系，\n       多重度 * : 1 表示多个涉众共同关注同一业务。\n    3. 虚线 «冲突» 表示两涉众关注点相互制约，\n       在涉众报告中给出协调策略。\n}\n\nnotice \"优先级提示\" {\n    高影响 + 高利益：顾客、会员顾客、店长、集团总部、\n                    供应商、政府监管部门（关键玩家）\n    高影响 + 低利益：支付机构、商场物业（保持满意）\n    低影响 + 高利益：收银员、理货员、客服专员（保持告知）\n}\n"},{"n":"02-业务用例模型.uml","s":"@diagram usecase \"图3-1 超市业务用例模型\"\n\n// ================= 业务边界 =================\nboundary \"超市业务（连锁超市××店）\" :solid\n\n// ================= 外部业务角色 =================\nbusiness actor 顾客\nbusiness actor 会员顾客\nbusiness actor 供应商\nbusiness actor 集团总部采购中心\nbusiness actor 支付机构\nbusiness actor 市场监管部门\n\n// ================= 业务工人（本工具渲染在边界外，语义上位于业务边界内） =================\nbusiness actor 店长\nbusiness actor 收银员\nbusiness actor 理货员\nbusiness actor 收货员\n\n// ================= 业务用例 =================\nbusiness usecase 选购与结算 :boundary\nbusiness usecase 会员注册与积分管理 :boundary\nbusiness usecase 商品退换与售后 :boundary\nbusiness usecase 商品咨询与投诉处理 :boundary\nbusiness usecase 门店补货与收货入库 :boundary\nbusiness usecase 商品采购与订货 :boundary\nbusiness usecase 卖场陈列与生鲜加工 :boundary\nbusiness usecase 库存盘点与损耗处理 :boundary\nbusiness usecase 促销活动执行 :boundary\nbusiness usecase 全渠道订单拣货与配送 :boundary\nbusiness usecase 日结与资金对账 :boundary\nbusiness usecase 供应商对账与结算 :boundary\nbusiness usecase 食品安全与溯源管理 :boundary\n\n// ================= 角色—用例关联 =================\n顾客 --> 选购与结算\n顾客 --> 商品退换与售后\n顾客 --> 商品咨询与投诉处理\n会员顾客 --> 会员注册与积分管理\n收银员 --> 选购与结算\n收银员 --> 商品退换与售后\n供应商 --> 门店补货与收货入库\n供应商 --> 供应商对账与结算\n集团总部采购中心 --> 商品采购与订货\n集团总部采购中心 --> 促销活动执行\n支付机构 --> 选购与结算 : 参与支付\n市场监管部门 --> 食品安全与溯源管理\n店长 --> 日结与资金对账\n店长 --> 库存盘点与损耗处理\n店长 --> 促销活动执行\n理货员 --> 卖场陈列与生鲜加工\n理货员 --> 库存盘点与损耗处理\n收货员 --> 门店补货与收货入库\n\n// ================= 角色泛化 =================\n会员顾客 --|> 顾客 : 泛化\n\n// ================= 用例之间的关系 =================\n选购与结算 ..> 促销活动执行 : «include»\n选购与结算 ..> 会员注册与积分管理 : «include»\n全渠道订单拣货与配送 ..> 选购与结算 : «include»\n食品安全与溯源管理 ..> 门店补货与收货入库 : «include»\n商品退换与售后 ..> 选购与结算 : «extend»\n库存盘点与损耗处理 ..> 卖场陈列与生鲜加工 : «extend»\n\n// ================= 说明 =================\nnotice \"图例说明\" {\n    1. business actor / business usecase 上的紫色斜杠表示业务模型元素。\n    2. 店长、收银员、理货员、收货员 是业务工人（内部角色），\n       严格 UML 中应绘于业务边界之内；本工具统一将 actor 渲染在\n       边界外，故以文字标注区分，语义不变。\n    3. 核心业务用例为「选购与结算」，其内部业务流程\n       见 图4-2（顺序图）与 图4-3（活动图）。\n}\n"},{"n":"03-业务对象模型.uml","s":"@diagram class \"图4-1 超市业务对象模型\"\n\n// ============================================================\n// 一、业务实体：人（顾客侧）\n// ============================================================\nclass 顾客 {\n    - 顾客编号: String\n    - 手机号: String\n    - 是否会员: Boolean\n    + 出示会员码(): String\n    + 付款(金额: Money): Boolean\n}\n\nclass 会员 {\n    - 会员卡号: String\n    - 等级: 普通/银卡/金卡\n    - 积分余额: Int\n    - 优惠券列表: List\n    + 累计积分(消费额: Money)\n    + 核销优惠券(券号: String): Boolean\n    + 查询权益(): List\n}\n\n// ============================================================\n// 二、业务实体：商品与价格\n// ============================================================\nclass 商品 {\n    - 条码: String\n    - 名称: String\n    - 规格: String\n    - 售价: Money\n    - 进价: Money\n    - 是否称重: Boolean\n    - 保质期天数: Int\n    + 计算售价(会员: 会员): Money\n    + 判断临期(): Boolean\n}\n\nclass 品类 {\n    - 品类编码: String\n    - 名称: String\n    - 毛利目标: Percent\n    + 汇总销售(): Money\n}\n\nclass 促销活动 {\n    - 活动编号: String\n    - 类型: 特价/满减/买赠/会员价\n    - 起止时间: DateTime\n    - 适用门店: List\n    + 匹配商品(条码: String): Boolean\n    + 计算优惠(件数: Int, 金额: Money): Money\n}\n\nclass 货架陈列位 {\n    - 货位编码: String\n    - 区域: String\n    - 层数: Int\n    - 陈列面数: Int\n    + 生成补货任务()\n}\n\n// ============================================================\n// 三、业务实体：库存与供应链\n// ============================================================\nclass 库存 {\n    - 现存数量: Int\n    - 锁定数量: Int\n    - 安全库存: Int\n    - 库位: String\n    + 可用量(): Int\n    + 扣减(数量: Int): Boolean\n    + 触发补货预警(): Boolean\n}\n\nclass 库存批次 {\n    - 批次号: String\n    - 生产日期: Date\n    - 到期日: Date\n    - 批次数量: Int\n    + 先进先出扣减(数量: Int)\n}\n\nclass 供应商 {\n    - 供应商编码: String\n    - 名称: String\n    - 结算账期: Int\n    - 资质证照: List\n    + 对账(账期: String): 对账单\n}\n\nclass 采购订单 {\n    - 单号: String\n    - 订货日期: Date\n    - 状态: 草稿/已下达/部分到货/已完成\n    + 下达()\n    + 跟踪到货()\n}\n\nclass 采购明细 {\n    - 订货数量: Int\n    - 进价: Money\n    + 计算金额(): Money\n}\n\nclass 收货单 {\n    - 单号: String\n    - 收货时间: DateTime\n    - 验收结果: 合格/部分拒收\n    + 验收(批次: 库存批次): Boolean\n    + 入库()\n}\n\nclass 收货明细 {\n    - 应收数量: Int\n    - 实收数量: Int\n    - 拒收原因: String\n    + 计算差异(): Int\n}\n\n// ============================================================\n// 四、业务实体：销售与结算（业务事件）\n// ============================================================\nclass 销售单 {\n    - 单号: String\n    - 交易时间: DateTime\n    - 渠道: 到店/POS/线上\n    - 应收金额: Money\n    - 实收金额: Money\n    - 优惠金额: Money\n    - 状态: 进行中/已支付/已撤销/已退货\n    + 汇总(): Money\n    + 打印小票()\n    + 撤销()\n}\n\nclass 销售明细 {\n    - 行号: Int\n    - 数量: Int\n    - 单价: Money\n    - 折扣: Money\n    - 小计: Money\n    + 计算小计(): Money\n}\n\nclass 支付记录 {\n    - 流水号: String\n    - 支付渠道: 现金/银行卡/扫码/购物卡\n    - 金额: Money\n    - 结果: 成功/失败/已退款\n    - 交易时间: DateTime\n    + 发起支付(): Boolean\n    + 退款(): Boolean\n}\n\nclass 退货单 {\n    - 单号: String\n    - 退货原因: String\n    - 退款金额: Money\n    - 是否可二次销售: Boolean\n    + 审核(授权人: 员工): Boolean\n}\n\nclass 盘点单 {\n    - 单号: String\n    - 盘点日期: Date\n    - 账面数量: Int\n    - 实盘数量: Int\n    + 生成差异(): Int\n    + 报损(原因: String)\n}\n\n// ============================================================\n// 五、业务工人（内部执行者）\n// ============================================================\nabstract class 员工 {\n    - 工号: String\n    - 姓名: String\n    - 岗位: String\n    + 登录系统(账号: String): Boolean\n}\n\nclass 收银员 {\n    - 收银台号: String\n    - 授权额度: Money\n    + 扫码(条码: String)\n    + 收款(方式: String): 支付记录\n}\n\nclass 理货员 {\n    - 责任区域: String\n    + 补货(货位: 货架陈列位)\n    + 报损(数量: Int, 原因: String)\n}\n\nclass 收货员 {\n    - 班次: String\n    + 验收(收货单: 收货单)\n}\n\nclass 店长 {\n    - 门店编码: String\n    + 审批(单据: String): Boolean\n    + 查看经营看板()\n}\n\nclass 收银班次 {\n    - 班次号: String\n    - 开班时间: DateTime\n    - 交班时间: DateTime\n    - 备用金: Money\n    - 现金实收: Money\n    + 开班()\n    + 交班对账(): 差异金额\n}\n\n// ============================================================\n// 六、关系\n// ============================================================\n// --- 人 ---\n会员 --|> 顾客 : 泛化\n收银员 --|> 员工 : 泛化\n理货员 --|> 员工 : 泛化\n收货员 --|> 员工 : 泛化\n店长 --|> 员工 : 泛化\n\n顾客 \"1\" --> \"0..*\" 销售单 : 购买\n会员 \"1\" --> \"0..*\" 退货单 : 申请\n\n// --- 商品与价格 ---\n商品 \"*\" --> \"1\" 品类 : 归属\n商品 \"1\" --> \"1\" 库存 : 现有库存\n库存 \"1\" *-- \"0..*\" 库存批次 : 分批存放\n商品 \"*\" --> \"0..*\" 促销活动 : 参与\n商品 \"*\" --> \"0..1\" 货架陈列位 : 陈列于\n\n// --- 供应链 ---\n供应商 \"1\" --> \"0..*\" 采购订单 : 接受订货\n采购订单 \"1\" *-- \"1..*\" 采购明细 : 包含\n采购明细 \"*\" --> \"1\" 商品 : 指向\n采购订单 \"1\" --> \"0..*\" 收货单 : 到货生成\n收货单 \"1\" *-- \"1..*\" 收货明细 : 包含\n收货明细 \"*\" --> \"1\" 商品 : 指向\n收货单 ..> 库存 : 入库增加\n供应商 \"1\" --> \"0..*\" 收货单 : 送货\n\n// --- 销售与结算 ---\n销售单 \"1\" *-- \"1..*\" 销售明细 : 包含\n销售明细 \"*\" --> \"1\" 商品 : 对应\n销售单 \"1\" --> \"1..*\" 支付记录 : 通过…支付\n销售单 \"1\" --> \"1\" 收银班次 : 归属\n收银班次 \"*\" --> \"1\" 收银员 : 由…开班\n退货单 \"0..*\" --> \"1\" 销售单 : 依据原单\n退货单 \"*\" --> \"1\" 商品 : 退回\n盘点单 \"*\" --> \"1\" 库存 : 核对\n盘点单 \"*\" --> \"1\" 理货员 : 由…执行\n\n// ============================================================\n// 七、约束与说明\n// ============================================================\nnotice \"关键业务规则\" {\n    R1 明码标价：同一商品在同一门店同一时点只有一个生效售价。\n    R2 促销优先：会员价与促销取\"对顾客最有利\"的一档，不叠加。\n    R3 库存不为负：支付成功后才扣减库存，扣减失败需回滚交易。\n    R4 小票唯一：一张销售单对应唯一小票号，退货必须凭原单号。\n    R5 批次先进先出：生鲜按到期日先出，临期商品自动进入折价流程。\n    R6 账实一致：收银班次交班时现金 + 非现金 = 系统应收。\n}\n\nnotice \"模型说明\" {\n    1. 本图为业务对象模型：既有业务实体（如 商品、销售单），\n       也有业务工人（收银员、理货员、收货员、店长）及其班次对象。\n    2. 组合（实心菱形）：销售单—销售明细、采购订单—采购明细、\n       收货单—收货明细、库存—库存批次，整体销毁则部分随之销毁。\n    3. 多重度用于表达业务规则，例如 销售单 1 : 1..* 销售明细\n       表示\"一张小票至少一件商品\"。\n}\n"},{"n":"04-购物业务流程-顺序图.uml","s":"@diagram sequence \"图4-2 顾客购物业务流程顺序图（选购—结算—离店）\"\n\n// ================= 参与者 =================\nactor 顾客 as Cust\nbusiness boundary 卖场陈列区 as Shelf\nbusiness worker 收银员 as Cashier\nboundary 收银终端POS as POS\ncontrol 超市业务管理系统 as BMS\nentity 商品与价格库 as ProdDB\nentity 促销规则库 as PromoDB\nentity 库存台账 as Stock\nentity 会员中心 as MemberDB\nboundary 支付网关 as Pay\n\n// ================= 1. 选购 =================\nCust -> Shelf : 1. 浏览货架、挑选商品\nCust -> Shelf : 2. 生鲜区称重贴价签\nCust -> POS : 3. 携商品到收银台并放置于台面\n\nactivate POS\nCashier -> POS : 4. 询问顾客是否有会员码\nopt 顾客为会员\n    Cust -> POS : 4.1 出示会员码\n    POS ->> BMS : 4.2 提交会员码\n    activate BMS\n    BMS ->> MemberDB : 4.3 校验会员身份\n    activate MemberDB\n    MemberDB --> BMS : 4.4 会员信息（等级/积分/优惠券）\n    deactivate MemberDB\n    BMS --> POS : 4.5 会员识别成功及可用权益\n    deactivate BMS\nend\n\n// ================= 2. 逐件扫码与计价 =================\nloop 每件商品（1..n）\n    Cashier -> POS : 5. 扫描商品条码\n    POS ->> BMS : 5.1 提交条码与数量\n    activate BMS\n    BMS ->> ProdDB : 5.2 查询商品档案与售价\n    activate ProdDB\n    ProdDB --> BMS : 5.3 商品名称/规格/售价\n    deactivate ProdDB\n    BMS ->> PromoDB : 5.4 匹配生效促销\n    activate PromoDB\n    PromoDB --> BMS : 5.5 适用促销与优惠\n    deactivate PromoDB\n    BMS ->> Stock : 5.6 校验可售库存\n    activate Stock\n    Stock --> BMS : 5.7 可用数量\n    deactivate Stock\n    alt 商品可售\n        BMS --> POS : 5.8 返回商品行（单价/优惠/小计）\n    else 条码无效或缺货\n        BMS --> POS : 5.9 异常提示\n        Cashier -> Cust : 5.10 说明并请顾客更换商品\n    end\n    deactivate BMS\nend\n\n// ================= 3. 结算与收款 =================\nPOS ->> BMS : 6. 提交购物清单请求结算\nactivate BMS\nBMS -> BMS : 6.1 汇总金额、应用会员价与优惠券\nBMS --> POS : 6.2 返回应收金额与明细\ndeactivate BMS\n\nCashier -> Cust : 7. 报出应收金额、确认支付方式\nCashier -> POS : 8. 录入支付方式与实收\nPOS ->> Pay : 8.1 发起支付请求（金额/单号）\nactivate Pay\nPay --> POS : 8.2 返回支付结果\ndeactivate Pay\n\nPOS ->> BMS : 9. 回传支付结果与流水号\nactivate BMS\nalt 支付成功\n    BMS ->> Stock : 9.1 扣减库存（按批次先进先出）\n    activate Stock\n    Stock --> BMS : 9.2 扣减成功\n    deactivate Stock\n    BMS ->> MemberDB : 9.3 累计积分、核销优惠券\n    activate MemberDB\n    MemberDB --> BMS : 9.4 积分更新完成\n    deactivate MemberDB\n    BMS -> BMS : 9.5 生成销售单、写入当日销售流水\n    BMS --> POS : 9.6 打印小票指令（小票号/明细）\nelse 支付失败\n    BMS -> BMS : 9.7 交易置为未完成，可挂单\n    BMS --> POS : 9.8 提示重新支付或取消\n    Cashier -> Cust : 9.9 请顾客更换支付方式\nend\ndeactivate BMS\n\n// ================= 4. 交付与离店 =================\nPOS --> Cust : 10. 交付小票与商品\ndeactivate POS\nCashier -> Cust : 11. 提示取走商品、核对找零\nCust -> Shelf : 12. 经出口防损门离店\n"},{"n":"05-购物业务流程-活动图.uml","s":"@diagram activity \"图4-3 顾客购物业务流程活动图（泳道版）\"\n\nboundary \"超市购物业务流程\"\n\nswimlane \"顾客\" :h\nswimlane \"卖场（理货员）\" :h\nswimlane \"收银员\" :h\nswimlane \"超市业务管理系统\" :h\n\nstart in \"顾客\"\n:进店、取购物车或购物篮; in \"顾客\"\n:按品类浏览货架、挑选商品; in \"顾客\"\nif (是否生鲜或散装商品?) in \"顾客\"\n    :到生鲜区称重、打印价签并贴标; in \"卖场（理货员）\"\nendif\n:携商品到收银台排队; in \"顾客\"\n:将商品放置收银台台面; in \"顾客\"\n\n:逐件扫描商品条码; in \"收银员\"\n:询问顾客是否使用会员卡或优惠券; in \"收银员\"\nif (顾客出示会员码?) in \"收银员\"\n    :录入会员码; in \"收银员\"\n    :校验会员身份，读取等级、积分与优惠券; in \"超市业务管理系统\"\n    :匹配会员价与生效促销规则; in \"超市业务管理系统\"\nelse\n    :按普通零售价计价; in \"超市业务管理系统\"\nendif\n\n:查询商品档案与售价; in \"超市业务管理系统\"\n:校验可售库存; in \"超市业务管理系统\"\nif (存在条码无效或缺货商品?) in \"超市业务管理系统\"\n    :提示异常商品; in \"超市业务管理系统\"\n    :向顾客说明并更换/放弃该商品; in \"收银员\"\nendif\n\n:汇总应收金额与优惠明细; in \"超市业务管理系统\"\n:报出应收金额并确认支付方式; in \"收银员\"\n:选择现金/银行卡/扫码等方式付款; in \"顾客\"\n:发起支付并接收支付网关结果; in \"超市业务管理系统\"\n\nif (支付成功?) in \"超市业务管理系统\"\n    :扣减库存（按批次先进先出）; in \"超市业务管理系统\"\n    :累计会员积分、核销优惠券; in \"超市业务管理系统\"\n    :生成销售单、写入当日销售流水; in \"超市业务管理系统\"\n    :打印小票并交付商品; in \"收银员\"\n    :核对小票与商品、取走商品; in \"顾客\"\n    if (需要退换货或开具发票?) in \"顾客\"\n        :受理退换货/开票申请; in \"收银员\"\n        :生成退货单或开票记录; in \"超市业务管理系统\"\n    endif\n    :经出口防损门离店; in \"顾客\"\nelse\n    :交易置为未完成或挂单; in \"超市业务管理系统\"\n    :告知支付失败并请顾客重试; in \"收银员\"\n    :重试支付或放弃购买; in \"顾客\"\n    :商品归位或挂单待结; in \"收银员\"\nendif\n\nstop in \"顾客\"\n\nnote: 本流程中\"超市业务管理系统\"承担商品与价格主数据、促销计算、库存校验与扣减、支付与对账、会员积分、销售数据沉淀六项职责。\n"}];
(function () {

    else fr.addEventListener('load', function () { setTimeout(function(){ cb(fr); }, 300); });
  }

  var frs = Array.prototype.slice.call(document.querySelectorAll('iframe.d'));

  var wanted = only ? frs.filter(function (f) { return f.dataset.f === only; }) : frs;
