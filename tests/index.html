<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMLite · 语法与布局测试</title>
<style>
  body{margin:0;padding:18px 22px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1e293b;}
  h1{font-size:16px;margin:0 0 4px;}
  .sub{color:#64748b;font-size:12px;margin-bottom:14px;}
  .sum{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;margin-bottom:14px;}
  .sum.ok{background:#dcfce7;color:#047857;}
  .sum.bad{background:#fee2e2;color:#b91c1c;}
  ul{list-style:none;margin:0;padding:0;}
  li{background:#fff;border:1px solid #dde4ee;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;display:flex;gap:10px;align-items:flex-start;}
  li .mark{font-weight:700;width:16px;flex:0 0 16px;}
  li.ok .mark{color:#059669;}
  li.bad{border-color:#fecaca;background:#fff7f7;}
  li.bad .mark{color:#dc2626;}
  .fails{margin:6px 0 0;padding-left:18px;color:#b91c1c;font-size:12px;font-family:"SF Mono",Menlo,Consolas,monospace;white-space:pre-wrap;}
  .group{margin:16px 0 6px;font-size:12px;color:#64748b;letter-spacing:.4px;}
</style>
</head>
<body>
<h1>UMLite · 语法与布局测试</h1>
<div class="sub">与 <code>node tests/run.mjs</code> 共用同一套用例（<code>tests/cases.js</code>）；本页只跑逻辑层，页面级冒烟请看 <code>tests/page.mjs</code>。</div>
<div id="summary" class="sum"></div>
<ul id="list"></ul>

<script src="../js/util.js"></script>
<script src="../js/layoutcode.js"></script>
<script src="../js/parser.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/pipeline.js"></script>
<script src="../js/render.js"></script>
<script src="harness.js"></script>
<script src="cases.js"></script>
<script>
(function () {
  'use strict';
  const t0 = performance.now();
  const results = window.UMLiteTests.runCases(window.TEST_CASES);
  const ms = Math.round(performance.now() - t0);
  const failed = results.filter(r => !r.ok).length;

  const sum = document.getElementById('summary');
  sum.className = 'sum ' + (failed ? 'bad' : 'ok');
  sum.textContent = failed
    ? failed + ' 项失败 / 共 ' + results.length + ' 项（' + ms + 'ms）'
    : '全部通过 · ' + results.length + ' 项（' + ms + 'ms）';

  const list = document.getElementById('list');
  for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'ok' : 'bad';
    const mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = r.ok ? '✓' : '✗';
    const body = document.createElement('div');
    body.textContent = r.name;
    li.appendChild(mark);
    li.appendChild(body);
    if (!r.ok) {
      const ul = document.createElement('ul');
      ul.className = 'fails';
      for (const f of r.fails) {
        const li2 = document.createElement('li');
        li2.textContent = f;
        ul.appendChild(li2);
      }
      body.appendChild(ul);
    }
    list.appendChild(li);
  }
})();
</script>
</body>
</html>
