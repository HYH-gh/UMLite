<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMLite · 文本驱动 UML 绘图工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">UMLite<small>文本驱动 UML 绘图</small></div>
  <select id="samples" title="载入示例"></select>
  <div class="spacer"></div>
  <button id="btn-writeback">反写代码</button>
  <button class="ghost" id="btn-doc"> 下载语言文档 (.md)</button>
  <!-- <button id="btn-copy">复制代码</button> -->
  <button class="ghost" id="btn-open">导入 .uml</button>   
  <button id="btn-src">下载 .uml</button>
  <button id="btn-svg">下载 SVG</button>
  <button class="primary" id="btn-png">下载 PNG</button>
</header>
<input type="file" id="file-uml" accept=".uml,.txt,text/plain" hidden>

<main>
  <div class="pane" id="left">
    <div class="pane-head">📝 源代码 <span class="hint">支持 class / usecase / activity / er / sequence / state / component / deployment / object / package</span></div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div class="divider" id="divider"></div>
  <div class="pane" id="right">
    <div class="pane-head">
      👁 预览
      <span class="badge">滚轮缩放</span>
      <span class="badge">拖拽元素</span>
      <span class="badge">空白处拖拽平移</span>
      <button id="btn-reset" style="padding:3px 10px;font-size:11.5px;">⟲ 复位视图</button>
      <button id="btn-refresh" style="padding:3px 10px;font-size:11.5px;">⟳ 刷新渲染</button>
      <span class="zoominfo" id="zoominfo">100%</span>
    </div>
    <div id="preview"></div>
  </div>
</main>

<div id="status">就绪</div>


  <script src="js/util.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/render.js"></script>
  <script src="js/view.js"></script>
  <script src="js/export.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
