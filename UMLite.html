<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMLite · 文本驱动 UML 绘图工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 内联 SVG 图标库（line 风格，随 currentColor 变化） -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="ic-file" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11H4m15.5 5a.5.5 0 0 0 .5-.5V8a1 1 0 0 0-1-1h-3.75a1 1 0 0 1-.829-.44l-1.436-2.12a1 1 0 0 0-.828-.44H8a1 1 0 0 0-1 1M4 9v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-3.75a1 1 0 0 1-.829-.44L9.985 8.44A1 1 0 0 0 9.157 8H5a1 1 0 0 0-1 1Z"/></symbol>
  <symbol id="ic-open" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 19V6a1 1 0 0 1 1-1h4.032a1 1 0 0 1 .768.36l1.9 2.28a1 1 0 0 0 .768.36H16a1 1 0 0 1 1 1v1M3 19l3-8h15l-3 8H3Z"/></symbol>
  <symbol id="ic-export" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 15v2a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-2M12 4v12m0-12 4 4m-4-4L8 8"/></symbol>
  <symbol id="ic-history" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3M3.22302 14C4.13247 18.008 7.71683 21 12 21c4.9706 0 9-4.0294 9-9 0-4.97056-4.0294-9-9-9-3.72916 0-6.92858 2.26806-8.29409 5.5M7 9H3V5"/></symbol>
  <symbol id="ic-help" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.529 9.988a2.502 2.502 0 1 1 5 .191A2.441 2.441 0 0 1 12 12.582V14m-.01 3.008H12M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></symbol>
  <symbol id="ic-source" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 3v4a1 1 0 0 1-1 1H5m5 4-2 2 2 2m4-4 2 2-2 2m5-12v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7.914a1 1 0 0 1 .293-.707l3.914-3.914A1 1 0 0 1 9.914 3H18a1 1 0 0 1 1 1Z"/></symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.651 7.65a7.131 7.131 0 0 0-12.68 3.15M18.001 4v4h-4m-7.652 8.35a7.13 7.13 0 0 0 12.68-3.15M6 20v-4h4"/></symbol>

  <!-- ---- 文件区：目录 / 各类图的线条图标（与上面同一风格：24×24、stroke=2、currentColor） ---- -->
  <symbol id="ic-folder" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 19V6a1 1 0 0 1 1-1h4.6a1 1 0 0 1 .8.4L11 7h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></symbol>
  <symbol id="ic-folder-open" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.2 19.2V6.2a1 1 0 0 1 1-1h4.4l2 2.4h8.2a1 1 0 0 1 1 1v2.2M3.2 19.2l2.9-8.6a1 1 0 0 1 .95-.68H21a.9.9 0 0 1 .85 1.2l-2.6 7.8a1 1 0 0 1-.95.68H4.2a1 1 0 0 1-1-.6Z"/></symbol>
  <symbol id="ic-caret" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.5 6.5 15 12l-5.5 5.5"/></symbol>
  <symbol id="ic-newfile" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.5 3.5h7l4 4v13h-11zM13.5 3.5v4h4M12 11v6M9 14h6"/></symbol>
  <symbol id="ic-uml-class" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h14v16H5zM5 9.4h14M5 14.2h14"/></symbol>
  <symbol id="ic-uml-object" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h14v16H5zM8.5 8.4h7M5 11h14"/></symbol>
  <symbol id="ic-uml-usecase" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3.6c4.9 0 8.9 3.8 8.9 8.4s-4 8.4-8.9 8.4S3.1 16.6 3.1 12 7.1 3.6 12 3.6Z"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 7.9a1.1 1.1 0 1 0 2.2 0 1.1 1.1 0 0 0-2.2 0ZM12.1 9v3.4M9.9 10.5h4.4M12.1 12.4l-1.6 2.7M12.1 12.4l1.6 2.7"/></symbol>
  <symbol id="ic-uml-activity" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3.4 20.6 12 12 20.6 3.4 12z"/></symbol>
  <symbol id="ic-uml-sequence" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.4 8.2V19M17.6 8.2V19M3.4 4.6h6V8.2h-6zM14.6 4.6h6V8.2h-6zM6.4 12.4h11M14.8 10.4l2.6 2-2.6 2"/></symbol>
  <symbol id="ic-uml-state" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 6.4h10A3.6 3.6 0 0 1 20.6 10v4a3.6 3.6 0 0 1-3.6 3.6H7A3.6 3.6 0 0 1 3.4 14v-4A3.6 3.6 0 0 1 7 6.4Z"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.2 12h.01"/></symbol>
  <symbol id="ic-uml-er" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4.4h16v15.2H4zM4 9h16M9.6 9v10.6"/></symbol>
  <symbol id="ic-uml-component" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4.6h11.4v14.8H8zM4 8.6h4v2.6H4zM4 13.4h4V16H4z"/></symbol>
  <symbol id="ic-uml-deployment" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.2 9.4h9.6v9.4H5.2zM5.2 9.4 9.2 5.4h9.6l-4 4M14.8 9.4l4-4v9.4l-4 4"/></symbol>
  <symbol id="ic-uml-package" viewBox="0 0 24 24" fill="none"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.6 19.4V5h6.8l2.2 2.6h7.8v11.8zM3.6 9h16.8"/></symbol>
</svg>

<header>
  <div class="logo">UMLite<small>文本驱动 UML 绘图</small></div>
  <span class="sel-ic"><svg class="ic"><use href="#ic-open"></use></svg><select id="samples" title="载入示例"></select></span>
  <div class="spacer"></div>

  <button id="btn-writeback" title="把当前画布位置写回源码末尾">反写代码</button>
  <button class="ghost" id="btn-undo" title="撤销（Ctrl+Z）" disabled>↶<span class="lbl"> 撤销</span></button>
  <button class="ghost" id="btn-redo" title="重做（Ctrl+Shift+Z）" disabled>↷<span class="lbl"> 重做</span></button>

  <div class="menu">
    <button type="button" class="ghost menu-btn"><svg class="ic"><use href="#ic-file"></use></svg><span class="lbl">文件</span><span class="caret">▾</span></button>
    <div class="menu-drop drop-right">
      <button type="button" class="menu-item" data-click="btn-open">导入 .uml…（到选中目录）</button>
      <button type="button" class="menu-item" data-click="btn-proj-open">导入整个项目 .json…</button>
      <div class="menu-sep"></div>
      <button type="button" class="menu-item" data-click="btn-copy">复制代码</button>
    </div>
  </div>

  <div class="menu">
    <button type="button" class="ghost menu-btn"><svg class="ic"><use href="#ic-export"></use></svg><span class="lbl">导出</span><span class="caret">▾</span></button>
    <div class="menu-drop">
      <button type="button" class="menu-item" data-click="btn-src">下载 .uml 源文件</button>
      <button type="button" class="menu-item" data-click="btn-svg">下载 SVG 矢量图</button>
      <button type="button" class="menu-item" data-click="btn-png">下载 PNG 位图</button>
      <div class="menu-sep"></div>
      <button type="button" class="menu-item" data-click="btn-proj-save">导出整个项目 .json</button>
    </div>
  </div>

  <button class="ghost" id="btn-history" title="最近保存的图"><svg class="ic"><use href="#ic-history"></use></svg><span class="lbl">历史</span></button>

  <div class="menu">
    <button type="button" class="ghost menu-btn"><svg class="ic"><use href="#ic-help"></use></svg><span class="lbl">帮助</span><span class="caret">▾</span></button>
    <div class="menu-drop">
      <button type="button" class="menu-item" data-click="btn-doc">下载语言文档 (.md)</button>
    </div>
  </div>
</header>

<!-- 窄屏（≤720px）用标签切换代码与预览，避免两个面板都挤成一条 -->
<nav id="pane-tabs" class="mobile-tabs" role="tablist" aria-label="面板切换">
  <button type="button" role="tab" data-pane="code" aria-selected="true"><span class="tab-ic">&lt;/&gt;</span>代码</button>
  <button type="button" role="tab" data-pane="preview" aria-selected="false"><span class="tab-ic">▦</span>预览</button>
</nav>

<!-- 被二级菜单收纳的真实按钮（保留 id，供菜单项 data-click 转发触发） -->
<button id="btn-open" hidden></button>
<button id="btn-copy" hidden></button>
<button id="btn-src" hidden></button>
<button id="btn-svg" hidden></button>
<button id="btn-png" hidden></button>
<button id="btn-doc" hidden></button>
<button id="btn-proj-open" hidden></button>
<button id="btn-proj-save" hidden></button>
<input type="file" id="file-uml" accept=".uml,.txt,text/plain" hidden>
<input type="file" id="file-project" accept=".json,application/json" hidden>

<div id="history-panel" class="history-panel hidden">
  <div class="history-head">
    <svg class="ic"><use href="#ic-history"></use></svg>历史记录 <span class="history-count" id="history-count"></span>
    <span style="flex:1"></span>
    <button class="ghost" id="his-clear">清空</button>
  </div>
  <div class="history-list" id="history-list"></div>
</div>

<main>
  <div class="pane" id="left">
    <div class="pane-head">
      <svg class="ic ic-title"><use href="#ic-source"></use></svg>源代码
      <button type="button" id="btn-files" class="pane-toggle" title="显示 / 隐藏文件区">
        <svg class="ic ic-sm"><use href="#ic-folder"></use></svg><span class="lbl">文件</span>
      </button>
      <span class="hint">支持 class / usecase / activity / er / sequence / state / component / deployment / object / package</span>
    </div>

    <!-- 文件区：虚拟目录树（只影响页面显示，导出时是多层嵌套的 JSON） -->
    <div id="files-pane">
      <div class="files-head">
        <svg class="ic ic-title"><use href="#ic-folder-open"></use></svg>
        <span class="files-title">文件</span>
        <span class="files-path" id="files-path"></span>
        <span class="files-tools">
          <button type="button" class="fs-btn" data-fs="new-file" title="在选中目录下新建一张图">
            <svg class="ic ic-sm"><use href="#ic-newfile"></use></svg>图
          </button>
          <button type="button" class="fs-btn" data-fs="new-folder" title="新建目录">
            <svg class="ic ic-sm"><use href="#ic-folder"></use></svg>目录
          </button>
          <button type="button" class="fs-btn" data-fs="rename" title="重命名选中的目录（也可双击目录名）">重命名</button>
          <button type="button" class="fs-btn" data-fs="delete" title="删除选中的目录或图">删除</button>
        </span>
      </div>
      <div id="file-tree" class="file-tree" role="tree" aria-label="文件列表"></div>
      <div class="files-hint" id="files-hint">拖动文件或目录可调整层级 · 双击目录名重命名</div>
    </div>
    <div class="files-divider" id="files-divider" title="拖动调整文件区高度"></div>

    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div class="divider" id="divider"></div>
  <div class="pane" id="right">
    <div class="pane-head">
      预览
      <span class="badge">滚轮缩放</span>
      <span class="badge">拖拽元素</span>
      <span class="badge">空白处拖拽平移</span>
      <span class="badge">Ctrl+Z 撤销</span>
      <button id="btn-reset" style="padding:3px 10px;font-size:11.5px;">⟲ 复位视图</button>
      <button id="btn-refresh" style="padding:3px 10px;font-size:11.5px;"><svg class="ic ic-sm"><use href="#ic-refresh"></use></svg>刷新渲染</button>
      <span class="fs-wrap" title="统一调整画布字号"><span class="fs-label">A</span><input type="range" id="font-scale" min="70" max="160" value="100" step="5"><span class="fs-label" id="font-scale-val">100%</span></span>
      <span class="zoominfo" id="zoominfo">100%</span>
    </div>
    <div id="preview"></div>
  </div>
</main>

<footer id="statusbar">
  <div id="status">就绪</div>
  <button type="button" id="ver-chip" class="ver-chip">v1.21</button>
</footer>

<!-- 更新公告：首次打开自动弹，之后点右下角版本号查看 -->
<div id="notice-mask" class="notice-mask" aria-hidden="true">
  <div class="notice" role="dialog" aria-modal="true" aria-labelledby="notice-title">
    <div class="notice-head">
      <h2 id="notice-title">更新公告</h2>
      <button type="button" id="notice-close" class="notice-close" aria-label="关闭">×</button>
    </div>
    <div class="notice-body" id="notice-body"></div>
    <div class="notice-foot">
      <span class="notice-tip">更新内容随代码提交同步维护</span>
      <button type="button" id="notice-ok" class="notice-ok">知道了</button>
    </div>
  </div>
</div>

<!-- 通用选择弹窗：导入整个项目时询问「覆盖 / 插入」 -->
<div id="ask-mask" class="notice-mask" aria-hidden="true">
  <div class="notice ask" role="dialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="notice-head"><h2 id="ask-title">请选择</h2></div>
    <div class="notice-body">
      <p id="ask-msg" class="ask-msg"></p>
      <div id="ask-extra" class="ask-meta" style="display:none;white-space:pre-line"></div>
    </div>
    <div class="notice-foot">
      <button type="button" id="ask-cancel" class="ask-btn">取消</button>
      <span id="ask-actions" class="ask-actions"></span>
    </div>
  </div>
</div>

<!-- 文件树右键 / 长按菜单 -->
<div id="tree-menu" class="tree-menu hidden"></div>


  <script src="js/util.js"></script>
  <script src="js/layoutcode.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pipeline.js"></script>
  <script src="js/render.js"></script>
  <script src="js/view.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/export.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/files.js"></script>
  <script src="js/history.js"></script>
  <script src="js/changelog.js"></script>
  <script src="js/notice.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
